<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
  </defs>

  <!-- TITLE -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Figure 1: SentinelAI Autonomous SOC Architecture &amp; Investigation Pipeline</text>
  <text x="550" y="60" text-anchor="middle" font-size="12" fill="#64748b">Multi-Sensor Telemetry Ingestion, Tri-Context RAG Enrichment, LangGraph LLM Orchestration, and HITL SOAR Containment</text>

  <!-- LAYER 1: SENSOR INGESTION -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="220" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="40" y="90" width="220" height="34" rx="10" fill="#e2e8f0"/>
    <text x="150" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">1. Telemetry Ingestion</text>

    <!-- Wazuh Agent Box -->
    <rect x="55" y="135" width="190" height="75" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="157" font-size="12" font-weight="600" fill="#0284c7">Wazuh Cloud Agent</text>
    <text x="65" y="174" font-size="10.5" fill="#475569">Endpoint &amp; Windows Logs</text>
    <text x="65" y="191" font-size="10" fill="#64748b">Active: DESKTOP-AG44JE8</text>

    <!-- Suricata Box -->
    <rect x="55" y="225" width="190" height="75" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="65" y="247" font-size="12" font-weight="600" fill="#0d9488">Suricata NIDS</text>
    <text x="65" y="264" font-size="10.5" fill="#475569">Network EVE JSON Telemetry</text>
    <text x="65" y="281" font-size="10" fill="#64748b">Port scans, DoS, anomalies</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <line x1="260" y1="210" x2="310" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="198" text-anchor="middle" font-size="10" fill="#3b82f6" font-weight="600">REST</text>

  <!-- LAYER 2: INGESTION, DB & ML -->
  <g filter="url(#shadow)">
    <rect x="310" y="90" width="230" height="240" rx="10" fill="url(#grad-blue)" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="310" y="90" width="230" height="34" rx="10" fill="#bfdbfe"/>
    <text x="425" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2. Normalization &amp; ML</text>

    <rect x="325" y="135" width="200" height="48" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
    <text x="335" y="154" font-size="11.5" font-weight="600" fill="#1e40af">FastAPI Router (/sensors)</text>
    <text x="335" y="170" font-size="10" fill="#64748b">Token Auth &amp; Canonical Normalizer</text>

    <rect x="325" y="192" width="200" height="58" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
    <text x="335" y="211" font-size="11.5" font-weight="600" fill="#1e40af">IsolationForest ML Model</text>
    <text x="335" y="227" font-size="10" fill="#475569">Unsupervised Contamination: 0.05</text>
    <text x="335" y="241" font-size="9.5" fill="#64748b">Feature vector: Ports, flags, bytes</text>

    <rect x="325" y="260" width="200" height="48" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
    <text x="335" y="279" font-size="11.5" font-weight="600" fill="#1e40af">SQLite Async Relational Store</text>
    <text x="335" y="295" font-size="10" fill="#64748b">652 Events | 609 Alerts | 503 Incidents</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <line x1="540" y1="210" x2="590" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 3: CONTEXT ENRICHMENT (C2, C3, C4) -->
  <g filter="url(#shadow)">
    <rect x="590" y="90" width="230" height="240" rx="10" fill="url(#grad-orange)" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="590" y="90" width="230" height="34" rx="10" fill="#fed7aa"/>
    <text x="705" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">3. Tri-Context Enrichment</text>

    <rect x="605" y="135" width="200" height="48" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1"/>
    <text x="615" y="153" font-size="11" font-weight="600" fill="#c2410c">C2: 24h Historical Events</text>
    <text x="615" y="169" font-size="9.5" fill="#64748b">SQL correlation on src_ip/dst_ip</text>

    <rect x="605" y="192" width="200" height="48" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1"/>
    <text x="615" y="210" font-size="11" font-weight="600" fill="#c2410c">C3: Threat Intelligence (VT)</text>
    <text x="615" y="226" font-size="9.5" fill="#64748b">VirusTotal v3 IP reputation &amp; votes</text>

    <rect x="605" y="250" width="200" height="60" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1"/>
    <text x="615" y="268" font-size="11" font-weight="600" fill="#c2410c">C4: RAG Vector Store</text>
    <text x="615" y="284" font-size="9.5" fill="#475569">Qdrant Cloud (BAAI/bge-small-en-v1.5)</text>
    <text x="615" y="298" font-size="9" fill="#64748b">Top-4 MITRE ATT&amp;CK Runbooks</text>
  </g>

  <!-- ARROW 3 -> 4 (Downward to LangGraph) -->
  <line x1="705" y1="330" x2="705" y2="390" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="365" font-size="10" fill="#3b82f6" font-weight="600">Enriched Context</text>

  <!-- LAYER 4: LANGGRAPH ORCHESTRATOR & LLM INFERENCE -->
  <g filter="url(#shadow)">
    <rect x="180" y="390" width="740" height="150" rx="10" fill="url(#grad-purple)" stroke="#d8b4fe" stroke-width="1.5"/>
    <rect x="180" y="390" width="740" height="34" rx="10" fill="#e9d5ff"/>
    <text x="550" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#581c87">4. LangGraph Multi-Node Autonomous Investigation Engine</text>

    <!-- Node 1 -->
    <rect x="200" y="438" width="165" height="82" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
    <text x="210" y="460" font-size="11.5" font-weight="600" fill="#7e22ce">Enrichment Node</text>
    <text x="210" y="478" font-size="9.5" fill="#475569">Assembles telemetry,</text>
    <text x="210" y="493" font-size="9.5" fill="#475569">historical scans &amp; VT,</text>
    <text x="210" y="508" font-size="9.5" fill="#64748b">queries Qdrant vectors</text>

    <!-- Arrow N1 -> N2 -->
    <line x1="365" y1="479" x2="395" y2="479" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 2 -->
    <rect x="395" y="438" width="220" height="82" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
    <text x="405" y="460" font-size="11.5" font-weight="600" fill="#7e22ce">Analysis Node (LLM Inference)</text>
    <text x="405" y="478" font-size="9.5" fill="#1e293b">Primary: Groq Qwen-2.5-27B (1.18s)</text>
    <text x="405" y="493" font-size="9.5" fill="#64748b">Fallback: Gemini 1.5 Pro</text>
    <text x="405" y="508" font-size="9" fill="#7c3aed">Enforces Pydantic Schema</text>

    <!-- Arrow N2 -> N3 -->
    <line x1="615" y1="479" x2="645" y2="479" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 3 -->
    <rect x="645" y="438" width="255" height="82" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
    <text x="655" y="460" font-size="11.5" font-weight="600" fill="#7e22ce">Recommendation Node</text>
    <text x="655" y="478" font-size="9.5" fill="#475569">Synthesizes timeline &amp; root cause</text>
    <text x="655" y="493" font-size="9.5" fill="#475569">Calculates confidence &amp; risk rating</text>
    <text x="655" y="508" font-size="9.5" fill="#c2410c">Sets Status: PENDING_APPROVAL</text>
  </g>

  <!-- ARROW 4 -> 5 (Downward to Safety Gate) -->
  <line x1="550" y1="540" x2="550" y2="590" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="570" font-size="10" fill="#3b82f6" font-weight="600">ActionProposal</text>

  <!-- LAYER 5: HITL APPROVAL GATE & POLICY CONTROLS -->
  <g filter="url(#shadow)">
    <rect x="180" y="590" width="350" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="180" y="590" width="350" height="34" rx="10" fill="#e2e8f0"/>
    <text x="355" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">5. Human-in-the-Loop &amp; Policy Gate</text>

    <rect x="195" y="635" width="320" height="92" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="205" y="655" font-size="11" font-weight="600" fill="#0f172a">Analyst Decision on React Dashboard</text>
    <text x="205" y="673" font-size="10" fill="#15803d">&#x2714; Approved &#x2192; Invokes /api/v1/events/{id}/execute</text>
    <text x="205" y="690" font-size="10" fill="#b91c1c">&#x2718; Rejected &#x2192; Execution strictly blocked (HTTP 400)</text>
    <text x="205" y="707" font-size="9.5" fill="#64748b">Policy Safeguards: Idempotency, unapproved lock</text>
  </g>

  <!-- ARROW 5 -> 6 -->
  <line x1="530" y1="665" x2="570" y2="665" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="550" y="655" text-anchor="middle" font-size="9.5" font-weight="700" fill="#10b981">APPROVED</text>

  <!-- LAYER 6: SOAR REMEDIATION & VERIFICATION -->
  <g filter="url(#shadow)">
    <rect x="570" y="590" width="350" height="150" rx="10" fill="url(#grad-green)" stroke="#86efac" stroke-width="1.5"/>
    <rect x="570" y="590" width="350" height="34" rx="10" fill="#bbf7d0"/>
    <text x="745" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">6. SOAR Execution &amp; State Verification</text>

    <rect x="585" y="635" width="320" height="92" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1"/>
    <text x="595" y="655" font-size="11" font-weight="600" fill="#15803d">QuarantineManager.quarantine_ip()</text>
    <text x="595" y="673" font-size="10" fill="#166534">&#x2022; Windows netsh advfirewall inbound block rule</text>
    <text x="595" y="690" font-size="10" fill="#166534">&#x2022; Subprocess exit code verified (returncode == 0)</text>
    <text x="595" y="707" font-size="9.5" fill="#64748b">&#x2022; Committed to quarantined_ips.json &amp; Middleware</text>
  </g>

</svg>
